# Despliegue en Render (requiere plan de pago por el disco persistente)
services:
  - type: web
    name: mttos-pbs
    runtime: node
    plan: starter
    buildCommand: "echo sin dependencias"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: SETUP_CODE
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: datos
      mountPath: /data
      sizeGB: 1
